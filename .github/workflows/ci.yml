name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Test the version Heroku builds with, plus the previous LTS.
        node: ['22', '24']

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check every script
        run: |
          node --check server.js
          for file in js/*.js; do node --check "$file"; done

      - name: Run the test suite
        run: npm test

      - name: Confirm the app boots and serves the board
        run: |
          PORT=3999 node server.js &
          server_pid=$!
          for _ in $(seq 1 20); do
            if curl -sf -o /dev/null http://127.0.0.1:3999/; then break; fi
            sleep 0.5
          done
          curl -sf http://127.0.0.1:3999/ | grep -q 'id="board"'
          curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3999/missing | grep -q 404
          kill "$server_pid"
